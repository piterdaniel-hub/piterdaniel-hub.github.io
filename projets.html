<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Rwagaza Tech Solution</h1>
    <nav aria-label="Menu principal">
      <a href="index.html">Accueil</a>
      <a href="projets.html" aria-current="page">Projets</a>
      <a href="apprendre.html">Apprendre</a>
      <a href="galerie.html">Galerie</a>
      <a href="a-propos.html">À propos</a>
    </nav>
  </header>

  <main>
    <h2>Mes projets et services</h2>
    <p class="sous-titre">Appuie sur un projet pour lire tous les détails.</p>
    <div class="grille" id="liste-projets"></div>
  </main>

  <a class="wa-flottant" href="https://wa.me/243898560667" target="_blank" rel="noopener" aria-label="Me contacter sur WhatsApp">💬 WhatsApp</a>

  <footer>
    <p>
      <a href="index.html">Accueil</a>
      <a href="projets.html">Projets</a>
      <a href="apprendre.html">Apprendre</a>
      <a href="galerie.html">Galerie</a>
      <a href="a-propos.html">À propos</a>
    </p>
    <p>© 2026 Rwagaza Tech Solution</p>
  </footer>

  <script src="projets-data.js"></script>
  <script>
    (function () {
      var liste = document.getElementById("liste-projets");
      projets.forEach(function (p) {
        var a = document.createElement("a");
        a.className = "carte carte-lien";
        a.href = "projet.html?id=" + p.id;
        if (p.image) {
          var im = document.createElement("img");
          im.src = p.image;
          im.alt = p.titre;
          im.loading = "lazy";
          a.appendChild(im);
        } else if (p.icone) {
          var ic = document.createElement("span");
          ic.className = "icone";
          ic.textContent = p.icone;
          a.appendChild(ic);
        }
        var e = document.createElement("span");
        e.className = "etiquette";
        e.textContent = p.cat;
        var h = document.createElement("h3");
        h.textContent = p.titre;
        var r = document.createElement("p");
        r.textContent = p.resume;
        var plus = document.createElement("span");
        plus.className = "plus";
        plus.textContent = "Voir les détails →";
        a.appendChild(e);
        a.appendChild(h);
        a.appendChild(r);
        a.appendChild(plus);
        liste.appendChild(a);
      });
    })();
  </script>
  <script src="assistant.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
